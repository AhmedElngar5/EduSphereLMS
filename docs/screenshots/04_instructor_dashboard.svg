<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Light Slate Background -->
  <rect width="1200" height="700" fill="#f8fafc"/>

  <!-- Top Header -->
  <rect width="1200" height="60" fill="#ffffff" filter="url(#shadow4)"/>
  <rect x="25" y="14" width="32" height="32" rx="8" fill="#4f46e5"/>
  <text x="41" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">💼</text>
  <text x="68" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#0f172a">EduSphere</text>
  <rect x="165" y="21" width="115" height="20" rx="4" fill="#e0e7ff"/>
  <text x="222" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10" fill="#4338ca" text-anchor="middle">INSTRUCTOR STUDIO</text>
  <text x="1110" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#64748b" text-anchor="end">Jane Doe &bull; Sign Out</text>

  <!-- Sidebar (Left 220px) -->
  <g transform="translate(25, 80)">
    <rect width="210" height="595" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow4)"/>
    <rect x="12" y="20" width="186" height="40" rx="10" fill="#4f46e5"/>
    <text x="30" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff">📊 Dashboard</text>
    <text x="30" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748b">📚 My Courses</text>
    <text x="30" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748b">➕ Create Course</text>
    <text x="30" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748b">👥 Enrolled Students</text>
    <text x="30" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748b">💵 Earnings &amp; Sales</text>
    <text x="30" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748b">📈 Analytics</text>
  </g>

  <!-- Main Content (Right 915px) -->
  <g transform="translate(260, 80)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#0f172a">Instructor Studio</text>
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Monitor curriculum approvals, enrollment velocity, and creator revenue payouts</text>

    <!-- KPI Cards -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="215" height="100" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow4)"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#64748b">NET EARNINGS (80%)</text>
      <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#059669">$239.98</text>
      <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#059669">Creator revenue share</text>

      <rect x="233" y="0" width="215" height="100" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow4)"/>
      <text x="253" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#64748b">GROSS SALES</text>
      <text x="253" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#4f46e5">$299.98</text>
      <text x="253" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">From student checkouts</text>

      <rect x="466" y="0" width="215" height="100" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow4)"/>
      <text x="486" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#64748b">TOTAL LEARNERS</text>
      <text x="486" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#0284c7">10</text>
      <text x="486" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Active students enrolled</text>

      <rect x="700" y="0" width="215" height="100" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow4)"/>
      <text x="720" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#64748b">AVERAGE RATING</text>
      <text x="720" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#d97706">★ 4.9</text>
      <text x="720" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">From verified learners</text>
    </g>

    <!-- Course Management Table -->
    <g transform="translate(0, 185)">
      <rect width="915" height="410" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow4)"/>
      <text x="25" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#0f172a">Your Courses &amp; Approval Status</text>
      <line x1="25" y1="50" x2="890" y2="50" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Table Header -->
      <text x="25" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#94a3b8">COURSE TITLE</text>
      <text x="350" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#94a3b8">PRICE</text>
      <text x="450" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#94a3b8">ENROLLED</text>
      <text x="560" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#94a3b8">EARNINGS</text>
      <text x="680" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#94a3b8">STATUS</text>
      <text x="850" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#94a3b8" text-anchor="end">ACTIONS</text>
      <line x1="25" y1="85" x2="890" y2="85" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Row 1 -->
      <text x="25" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#0f172a">Full-Stack .NET 10 &amp; React Architecture</text>
      <text x="350" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#0f172a">$99.99</text>
      <text x="450" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">128 students</text>
      <text x="560" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#059669">$10,238.97</text>
      <rect x="680" y="100" width="70" height="20" rx="10" fill="#d1fae5"/>
      <text x="715" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10" fill="#065f46" text-anchor="middle">Published</text>
      <rect x="795" y="100" width="85" height="24" rx="6" fill="#e0e7ff"/>
      <text x="837" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#4338ca" text-anchor="middle">Curriculum</text>

      <!-- Row 2 -->
      <text x="25" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#0f172a">Event-Driven Microservices in .NET</text>
      <text x="350" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#0f172a">$149.99</text>
      <text x="450" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">84 students</text>
      <text x="560" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#059669">$10,079.32</text>
      <rect x="680" y="150" width="70" height="20" rx="10" fill="#d1fae5"/>
      <text x="715" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10" fill="#065f46" text-anchor="middle">Published</text>
      <rect x="795" y="150" width="85" height="24" rx="6" fill="#e0e7ff"/>
      <text x="837" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#4338ca" text-anchor="middle">Curriculum</text>
    </g>
  </g>
</svg>

