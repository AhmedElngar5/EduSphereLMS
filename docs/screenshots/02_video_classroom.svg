<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Theater Background -->
  <rect width="1200" height="700" fill="#090d16"/>

  <!-- Top Classroom Bar -->
  <rect width="1200" height="60" fill="#0f172a"/>
  <rect x="25" y="16" width="28" height="28" rx="8" fill="#1e293b"/>
  <text x="39" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#94a3b8" text-anchor="middle">←</text>
  <text x="70" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#f8fafc">Full-Stack .NET 10 &amp; React Enterprise Architecture</text>
  
  <rect x="940" y="15" width="235" height="30" rx="15" fill="#1e293b"/>
  <rect x="945" y="20" width="120" height="20" rx="10" fill="#4f46e5"/>
  <text x="1005" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">66% Complete</text>
  <text x="1115" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">2/3 Lessons</text>

  <!-- Video Player Section (Left 780px) -->
  <g transform="translate(25, 80)">
    <rect width="780" height="440" rx="16" fill="#000000" filter="url(#shadow2)"/>
    
    <!-- Video Content Placeholder with Play Button -->
    <rect x="30" y="30" width="720" height="380" rx="12" fill="#111827"/>
    <circle cx="390" cy="220" r="40" fill="#4f46e5"/>
    <polygon points="383,205 383,235 407,220" fill="#ffffff"/>
    <text x="390" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#e2e8f0" text-anchor="middle">Streaming via HTTP 206 Partial Content (Range Support)</text>

    <!-- Player Controls Overlay -->
    <rect x="30" y="380" width="720" height="30" rx="6" fill="#1e293b" fill-opacity="0.9"/>
    <rect x="45" y="393" width="450" height="4" rx="2" fill="#334155"/>
    <rect x="45" y="393" width="280" height="4" rx="2" fill="#6366f1"/>
    <circle cx="325" cy="395" r="5" fill="#ffffff"/>
    <text x="510" y="399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">15:42 / 24:18</text>
  </g>

  <!-- Lesson Details & Tabs (Bottom 780px) -->
  <g transform="translate(25, 540)">
    <rect width="780" height="135" rx="16" fill="#0f172a"/>
    <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#ffffff">Lesson 2: Implementing Clean Architecture in .NET 10</text>
    <text x="30" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Learn how to wire Domain, Application, and Infrastructure layers using standard dependency injection and EF Core.</text>
    
    <rect x="30" y="85" width="160" height="34" rx="8" fill="#059669"/>
    <text x="110" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">✓ Mark as Completed</text>
    <rect x="205" y="85" width="150" height="34" rx="8" fill="#1e293b"/>
    <text x="280" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#94a3b8" text-anchor="middle">Next Lesson →</text>
  </g>

  <!-- Curriculum Sidebar (Right 350px) -->
  <g transform="translate(830, 80)">
    <rect width="345" height="595" rx="16" fill="#0f172a" filter="url(#shadow2)"/>
    <text x="25" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#ffffff">Course Content</text>
    <line x1="25" y1="55" x2="320" y2="55" stroke="#1e293b" stroke-width="1"/>

    <!-- Section 1 Header -->
    <text x="25" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#818cf8">SECTION 1: ARCHITECTURE BASICS</text>
    
    <!-- Lesson 1 Item (Completed) -->
    <rect x="20" y="100" width="305" height="50" rx="10" fill="#1e293b" fill-opacity="0.5"/>
    <circle cx="45" cy="125" r="10" fill="#059669"/>
    <text x="45" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="65" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#cbd5e1">1. Domain Model Foundations</text>
    <text x="65" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">18:20 &bull; Video</text>

    <!-- Lesson 2 Item (Active) -->
    <rect x="20" y="160" width="305" height="50" rx="10" fill="#4f46e5"/>
    <circle cx="45" cy="185" r="10" fill="#ffffff"/>
    <text x="45" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" fill="#4f46e5" text-anchor="middle">▶</text>
    <text x="65" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#ffffff">2. Clean Architecture in .NET 10</text>
    <text x="65" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c7d2fe">24:18 &bull; In Progress</text>

    <!-- Lesson 3 Item (Uncompleted) -->
    <rect x="20" y="220" width="305" height="50" rx="10" fill="#1e293b" fill-opacity="0.3"/>
    <circle cx="45" cy="245" r="10" fill="#334155"/>
    <text x="45" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" fill="#94a3b8" text-anchor="middle">3</text>
    <text x="65" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#94a3b8">3. Fluent API Entity Mapping</text>
    <text x="65" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">20:45 &bull; Video</text>

    <!-- Certificate Milestone Badge -->
    <rect x="20" y="510" width="305" height="65" rx="12" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="40" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#c7d2fe">🎓 Verifiable Certificate</text>
    <text x="40" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a5b4fc">Complete Lesson 3 to claim your PDF certificate.</text>
  </g>
</svg>

